<main class="flex min-h-screen items-center justify-center bg-[#f3f5f8] px-5 py-10 font-cairo text-concord-ink">
  <section class="w-full max-w-[440px] rounded-2xl border border-[#e6ebf2] bg-white p-7 shadow-[0_16px_40px_rgba(22,40,61,0.08)] sm:p-10">
    <div class="mb-8 text-center">
      <img src="images/concord logo-01 png.png" alt="Concord" class="mx-auto mb-4 h-16 w-16 rounded-full" />
      <h1 class="m-0 text-2xl font-bold text-concord-navy">Admin sign in</h1>
     <!-- <p class="mt-2 mb-0 text-concord-muted">Connect to manage Concord projects.</p> -->
    </div>

    @if (error()) {
      <div class="mb-5 rounded-xl bg-[#fef3f2] px-4 py-3 text-sm text-concord-danger" role="alert">{{ error() }}</div>
    }

    <form #loginForm="ngForm" (ngSubmit)="submit(loginForm)" novalidate>
      <div class="mb-5">
        <label for="admin-email" class="mb-2 block text-sm font-semibold">Email address</label>
        <input
          id="admin-email"
          type="email"
          name="email"
          [(ngModel)]="email"
          (ngModelChange)="onEmailChange()"
          #emailInput="ngModel"
          required
          email
          autocomplete="email"
          class="h-12 w-full rounded-xl border border-concord-border px-4 outline-none transition focus:border-concord-navy focus:ring-2 focus:ring-[#dce7f2]"
          [class.border-concord-danger]="emailInput.invalid && (emailInput.touched || submitted)"
        />
        @if (emailInput.invalid && (emailInput.touched || submitted)) {
          <p class="mt-2 text-xs text-concord-danger">Enter a valid email address.</p>
        }
      </div>

      <div class="mb-6">
        <label for="admin-password" class="mb-2 block text-sm font-semibold">Password</label>
        <input
          id="admin-password"
          type="password"
          name="password"
          [(ngModel)]="password"
          #passwordInput="ngModel"
          required
          minlength="6"
          autocomplete="current-password"
          class="h-12 w-full rounded-xl border border-concord-border px-4 outline-none transition focus:border-concord-navy focus:ring-2 focus:ring-[#dce7f2]"
          [class.border-concord-danger]="passwordInput.invalid && (passwordInput.touched || submitted)"
        />
        @if (passwordInput.invalid && (passwordInput.touched || submitted)) {
          <p class="mt-2 text-xs text-concord-danger">Password must be at least 6 characters.</p>
        }
      </div>

      <button
        type="submit"
        class="flex h-12 w-full cursor-pointer items-center justify-center gap-2 rounded-xl border-0 bg-concord-navy font-semibold text-white transition hover:bg-concord-navy-deep disabled:cursor-not-allowed disabled:opacity-60"
        [disabled]="loading()"
      >
        @if (loading()) {
          <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
          Signing in...
        } @else {
          <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
          Sign in
        }
      </button>
    </form>

    <a routerLink="/" class="mt-6 flex items-center justify-center gap-2 text-sm font-semibold text-concord-muted no-underline hover:text-concord-navy">
      <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
      Back to website
    </a>
  </section>
</main>

<main class="career-detail-page">
  @if (loading()) {
    <div class="career-detail-loading">Loading...</div>
  } @else if (career()) {
    <div class="career-detail-shell">
      <section class="career-detail-copy">
        <a routerLink="/careers" class="back-link">&#8592; All careers</a>
        <p class="career-detail-kicker">{{ career().experience }} years experience</p>
        <h1>{{ career().title }}</h1>
        <p class="career-description">{{ career().description }}</p>
      </section>

      <form class="career-form" (ngSubmit)="submit()" #application="ngForm">
        <h2>Apply for this position</h2>

        <div class="form-grid">
          <input name="firstName" [(ngModel)]="form.firstName" required placeholder="First name" />
          <input name="lastName" [(ngModel)]="form.lastName" required placeholder="Last name" />
        </div>

        <div class="form-grid">
          <input name="email" [(ngModel)]="form.email" required type="email" placeholder="Email" />
          <input name="phone" [(ngModel)]="form.phone" required placeholder="Phone" />
        </div>

        <textarea name="coverLetter" [(ngModel)]="form.coverLetter" required rows="6" placeholder="Cover letter"></textarea>
        <input name="cvLink" [(ngModel)]="form.cvLink" required type="url" placeholder="CV link (Google Drive or other URL)" />

        <label class="data-check">
          <input type="checkbox" name="agreed" [(ngModel)]="agreed" required />
          <span>By using this form you agree with the storage and handling of your data by this website.</span>
        </label>

        @if (success()) {
          <p class="form-status success">{{ success() }}</p>
        }
        @if (error()) {
          <p class="form-status error">{{ error() }}</p>
        }

        <button type="submit" [disabled]="application.invalid || submitting()">
          {{ submitting() ? 'Submitting...' : 'Submit application' }}
        </button>
      </form>
    </div>
  }
</main>

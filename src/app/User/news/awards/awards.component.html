<main class="awards-page min-h-[70vh] font-cairo">
  <section class="awards-hero-wrap">
    <div class="awards-hero">
      <!-- <p class="awards-kicker">Recognition / 02</p> -->
      <h1>Awards</h1>

    </div>
  </section>

  <section class="awards-content" aria-label="Awards and recognition">
    @if (error()) {
      <div class="awards-state awards-error">{{ error() }}</div>
    }

    @if (loading()) {
      <div class="awards-state"><app-loading-spinner message="Loading awards..." /></div>
    } @else if (!awards().length) {
      <div class="awards-state">Awards will appear here soon.</div>
    } @else {
      <div class="awards-grid">
        @for (award of awards(); track award._id) {
          <article
            class="award-card"
          >
            <div class="award-image-wrap">
              <img
                [src]="award.image"
                [alt]="award.title"
                class="award-image"
              />
            </div>
            <div class="award-copy">
              <h2>{{ award.title }}</h2>
              <p>{{ award.subtitle }}</p>
            </div>
          </article>
        }
      </div>
    }
  </section>
</main>

<main class="articles-page min-h-[70vh] font-cairo">
  <section class="articles-hero">
    <div class="articles-hero-inner">
      <!-- <p class="articles-kicker">News / 01</p> -->
      <h1>Articles</h1>

    </div>
  </section>

  <section class="articles-content" aria-label="Articles">
    <div class="articles-toolbar">
      <input
        type="search"
        class="article-search"
        [(ngModel)]="search"
        placeholder="Search articles"
        (ngModelChange)="onSearchChange()"
      />
      <select
        class="article-select"
        [(ngModel)]="tag"
        (ngModelChange)="onTagChange()"
      >
        <option value="">All services</option>
        @for (item of tags; track item) {
          <option [value]="item">{{ item }}</option>
        }
      </select>
      @if (hasActiveFilters) {
        <button
          type="button"
          class="article-clear"
          (click)="clearFilters()"
        >
          <i class="fa-solid fa-rotate-left"></i>
          Clear
        </button>
      }
    </div>

    @if (error()) {
      <div class="articles-state articles-error">{{ error() }}</div>
    }

    @if (loading()) {
      <div class="articles-state"><app-loading-spinner message="Loading articles..." /></div>
    } @else if (!articles().length) {
      <div class="articles-state">No articles found.</div>
    } @else {
      @if (topArticle(); as top) {
        <a
          class="article-feature"
          [routerLink]="['/news/articles', top.slug || top._id]"
          [attr.aria-label]="'Read article: ' + top.title"
        >
          <img [src]="top.image" [alt]="top.title" class="article-feature-image" />
          <div class="article-feature-copy">
            <span class="article-feature-label">
              <i class="fa-solid fa-star"></i>
              Top Article
            </span>
            <h2>{{ top.title }}</h2>
            <!-- <p class="mt-3 line-clamp-3 text-concord-muted">{{ top.description }}</p> -->
            <span class="article-link">
              Read More <i class="fa-solid fa-chevron-right"></i>
            </span>
          </div>
        </a>
      }

      <div class="articles-grid">
        @for (article of articles(); track article._id) {
          <a
            [routerLink]="['/news/articles', article.slug || article._id]"
            class="article-card"
            [attr.aria-label]="'Read article: ' + article.title"
          >
            <div class="article-card-image">
              <img
                class="w-full"
                [src]="article.image"
                [alt]="article.title"
              />
            </div>
            <div class="article-card-body">
              <h2>{{ article.title }}</h2>
            </div>
          </a>
        }
      </div>
    }
  </section>
</main>
